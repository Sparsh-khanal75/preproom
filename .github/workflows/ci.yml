name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: preproom, POSTGRES_PASSWORD: preproom, POSTGRES_DB: preproom_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U preproom" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: api } }
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://preproom:preproom@localhost:5432/preproom_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=app --cov-fail-under=85
      - name: OpenAPI schema is up to date
        run: python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2))" > /tmp/openapi.json && diff -q /tmp/openapi.json openapi.json
      - run: pip install pip-audit && pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: preproom, POSTGRES_PASSWORD: preproom, POSTGRES_DB: preproom }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U preproom" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://preproom:preproom@localhost:5432/preproom
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      LLM_PROVIDER: mock
      STT_PROVIDER: mock
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Start API and worker
        working-directory: api
        run: |
          pip install -e .
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          nohup python -m app.jobs.worker > ../worker.log 2>&1 &
      - name: Build and start web
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npm start > ../web.log 2>&1 &
          npx playwright install --with-deps chromium
          npx wait-on -t 60000 http-get://localhost:3000 http-get://localhost:8000/api/health
      - run: npx playwright test
        working-directory: web
      - if: failure()
        run: tail -n 100 api.log worker.log web.log

  docker:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env: { JWT_SECRET: build-only-secret-that-is-at-least-32-characters }
