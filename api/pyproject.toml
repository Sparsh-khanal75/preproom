[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preproom-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pydantic-settings>=2.3", "email-validator>=2.1",
  "sqlalchemy[asyncio]>=2.0.30", "asyncpg>=0.29", "alembic>=1.13", "argon2-cffi>=23.1", "pyjwt>=2.8",
  "python-multipart>=0.0.9", "pyyaml>=6.0", "httpx>=0.27", "scikit-learn>=1.4",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "aiosqlite>=0.20", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.packs" = ["builtin/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/jobs/worker.py", "app/speech/transcribe.py"]
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["B008", "S101", "S105", "S106", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"alembic/*" = ["I"]
